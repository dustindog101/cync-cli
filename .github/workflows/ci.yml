name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python scripts/privacy_audit.py .

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build native helper
        run: |
          arch="$(uname -m)"
          swiftc -target "$arch-apple-macosx12.0" native/main.swift \
            -o "$RUNNER_TEMP/cync-helper" \
            -framework Cocoa -framework CoreBluetooth -framework Security
      - name: Run crypto self-test
        run: |
          "$RUNNER_TEMP/cync-helper" --crypto-self-test
